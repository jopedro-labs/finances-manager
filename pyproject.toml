[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finances-manager"
version = "0.1.0"
description = "Portfolio manager — AI-driven analysis via Gemini engine."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastparquet>=2024.2.0",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "google-genai>=0.1.0",
    "pandas>=2.2.0",
    "pydantic-settings>=2.0.0",
    "yfinance>=0.2.30",
]

[tool.setuptools.packages.find]
exclude = ["data*", "input*", "secrets*", ".gemini*", ".claude*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "BLE001",  # broad Exception catch is intentional in CLI entry-points
    "E501",    # line length — long log/error strings are left as-is intentionally
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
mypy_path = "stubs"